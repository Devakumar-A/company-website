<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons & Web Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Cognolynx: Custom Software &amp; AI Product Engineering</title>
    <meta name="description" content="Cognolynx builds high-performance custom software, modern digital products, and intelligent technology solutions to help forward-thinking businesses scale." />
    <link rel="canonical" href="https://cognolynx.tech/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000009" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cognolynx" />
    <meta property="og:title" content="Cognolynx: Custom Software &amp; AI Product Engineering" />
    <meta property="og:description" content="Cognolynx builds high-performance custom software, modern digital products, and intelligent technology solutions to help forward-thinking businesses scale." />
    <meta property="og:url" content="https://cognolynx.tech/" />
    <meta property="og:image" content="https://cognolynx.tech/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cognolynx: Custom Software &amp; AI Product Engineering" />
    <meta name="twitter:description" content="Cognolynx builds high-performance custom software, modern digital products, and intelligent technology solutions to help forward-thinking businesses scale." />
    <meta name="twitter:image" content="https://cognolynx.tech/og-image.png" />

    <!-- Site Name Structured Data (Homepage) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cognolynx",
      "alternateName": "Cognolynx Tech",
      "url": "https://cognolynx.tech/"
    }
    </script>

    <!-- DNS prefetch for external icon CDNs used below the fold in Technology section -->
    <link rel="dns-prefetch" href="https://cdn.simpleicons.org" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://api.iconify.design" />

    <!-- Preload Critical Above-The-Fold Assets (LCP Optimization) -->
    <link rel="preload" as="image" href="/assets/logo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/hero-video-poster-desktop.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/hero-video-poster-mobile.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Inline style: prevents any white flash before React mounts -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000009;
      }
      #root {
        width: 100%;
        min-height: 100%;
        background: #000009;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
