[build]
  command = "npm run build"
  publish = "dist"

# Long-term cache for version-hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static media and favicons
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# HTML files: always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Text and discoverability files
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Canonical domain redirects (301 permanent) to https://cognolynx.tech
[[redirects]]
  from = "https://www.cognolynx.tech/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cognolynx.tech/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cognolynx.tech/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

# Legacy domain redirects (.com -> .tech)
[[redirects]]
  from = "https://www.cognolynx.com/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cognolynx.com/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://cognolynx.com/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cognolynx.com/*"
  to = "https://cognolynx.tech/:splat"
  status = 301
  force = true

# Real 404 status for unknown URLs (prevents soft 404s in GSC)
# All valid routes are prerendered as static HTML files in dist/ and served directly by Netlify.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
